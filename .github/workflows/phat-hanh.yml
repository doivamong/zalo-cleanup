# Phát hành — mốc M6.
#
# Cổng M6: "build tái lập được từ CI công khai, mã băm khớp bản tải về."
#
# Vì sao cổng ấy không phải chuyện hình thức: người dùng MẤT khả năng đọc mã
# nguồn khi ta chuyển từ .ps1 sang .exe. Thứ duy nhất thay thế được là họ tự
# dựng lại rồi thấy mã băm khớp. Băm không khớp thì lời hứa "vẫn kiểm chứng
# được" là lời hứa rỗng.
#
# Hai thứ phá tính tái lập, cả hai đã đo được và đã bịt trong
# rust\tools\dung-phat-hanh.ps1: dấu thời gian trong đầu tệp PE, và đường dẫn
# tuyệt đối của thư mục build lọt vào chuỗi thông báo lỗi của glutin.

name: Phát hành

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dung:
    name: Dựng exe tái lập được
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # KHÔNG dùng bộ nhớ đệm ở đây. Bản phát hành phải dựng từ đầu, vì một bộ
      # đệm bẩn là đúng thứ mà cổng tái lập sinh ra để bắt.
      - name: Bản công cụ đang dùng
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          Write-Host "MSVC:"
          # Phiên bản trình liên kết ảnh hưởng tới đầu ra, nên phải ghi lại để
          # người dựng lại biết mình cần đúng bản nào.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          Write-Host "  Visual Studio $vs"
          # Bộ công cụ MSVC là ĐẦU VÀO của bản build, y như phiên bản rustc.
          # Không ghi lại nó thì người dựng lại không biết mình cần bản nào, và
          # "mã băm khớp" trở thành chuyện may rủi.
          $p = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "  Bộ công cụ MSVC có sẵn trên máy chủ này:"
          Get-ChildItem "$p\VC\Tools\MSVC" -Directory -EA SilentlyContinue |
            Sort-Object Name | ForEach-Object { Write-Host "    $($_.Name)" }

      - name: Dựng
        shell: powershell
        working-directory: .
        run: .\rust\tools\dung-phat-hanh.ps1

      - name: Băm và gói
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force phat-hanh | Out-Null
          Copy-Item rust\target\release\zalo-cli.exe phat-hanh\
          Copy-Item rust\target\release\zalo-gui.exe phat-hanh\
          Copy-Item ZaloCleanup.ps1 phat-hanh\
          Copy-Item rust\crates\zalo-gui\assets\DejaVuSans.LICENSE.txt phat-hanh\

          # MÔI TRƯỜNG DỰNG là một phần của bản phát hành, không phải siêu dữ
          # liệu cho vui. Cổng tái lập không đạt (xem docs/ke-hoach-port.md §M6),
          # nên thứ duy nhất còn nói được là "tệp này ra đời ở ĐÚNG chỗ này, lúc
          # này, bằng ĐÚNG bộ công cụ này". Không ghi lại thì mã băm là một con
          # số không truy được về đâu.
          Push-Location rust
          $rustc = (& rustc --version).Trim()
          Pop-Location
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = if (Test-Path $vswhere) { (& $vswhere -latest -property installationVersion) } else { 'không rõ' }
          @(
            "Dựng lúc      : $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')) UTC"
            "Commit        : $env:GITHUB_SHA"
            "Máy chủ       : $env:RUNNER_OS · ảnh $env:ImageVersion"
            "rustc         : $rustc"
            "Visual Studio : $vs"
            ""
            "Bộ thư viện CRT của Visual Studio được liên kết vào tệp thực thi, nên"
            "phiên bản của nó là ĐẦU VÀO của bản dựng ngang hàng với phiên bản rustc."
            "Máy chủ GitHub đổi ảnh giữa các lượt chạy, nên dựng lại ở nơi khác sẽ ra"
            "tệp khác. Xem docs/PHAT-HANH.md, mục kiểm chứng."
          ) -join "`r`n" | Set-Content phat-hanh\BUILD-ENV.txt -Encoding utf8
          $lines = @()
          foreach ($f in Get-ChildItem phat-hanh -File | Sort-Object Name) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($f.Name)"
          }
          # Dạng chuẩn của sha256sum, để người dùng kiểm bằng công cụ có sẵn.
          $lines -join "`n" | Set-Content phat-hanh\SHA256SUMS.txt -Encoding ascii -NoNewline
          Get-Content phat-hanh\SHA256SUMS.txt | Write-Host

      - uses: actions/upload-artifact@v4
        with:
          name: phat-hanh
          path: phat-hanh/

      # Chỉ tạo bản phát hành khi đẩy thẻ. `workflow_dispatch` chỉ dựng và băm,
      # để đối chiếu được mà không lỡ tay công bố.
      - name: Tạo bản phát hành
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: phat-hanh/*
          body_path: docs/PHAT-HANH.md
