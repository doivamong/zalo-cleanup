[package]
name = "zalo-core"
description = "Lõi của công cụ Dọn dẹp Zalo: quyết định xóa gì, và chặn cái gì."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# KHÔNG BAO GIỜ thêm phụ thuộc giao diện vào đây.
#
# Cổng M0 kiểm điều này bằng máy sau mỗi commit: `rust\tools\check-deps.ps1`
# chạy `cargo tree -p zalo-core` và bắt lỗi nếu thấy eframe, egui, winit hay
# accesskit. Đo được: lõi 36 crate, cộng giao diện thành 112 — nghĩa là 76 crate
# chỉ để vẽ cửa sổ, và chúng không được dính vào phần quyết định xóa gì.
[dependencies]
# Chuẩn hóa Unicode để bỏ dấu thanh. std không có. Kéo theo tinyvec, tổng 3 crate.
unicode-normalization = "0.1"
# SHA-256. std không có.
sha2 = "0.10"
# settings.json · catalog.json · bản kê sao lưu — phải giữ ĐÚNG định dạng cũ vì
# dùng chung tệp với bản PowerShell. Cố ý KHÔNG bật tính năng `derive`: nó kéo
# theo syn, quote và proc-macro2, mà đọc bằng `Value` thì không cần tới.
serde_json = "1"

[dev-dependencies]
